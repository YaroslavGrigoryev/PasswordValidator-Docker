name: Build and publish Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Define image name and tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build local image
        run: docker build -t password-validator:test .
      - name: Smoke test
        shell: bash
        run: |
          test "$(printf 'Abcdefg1\n' | docker run --rm -i password-validator:test)" = 'OK'
          test "$(printf 'abc\n' | docker run --rm -i password-validator:test)" = $'LEN\nUPPER\nDIGIT'
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
      - name: Verify published image
        shell: bash
        run: |
          image='${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}'
          docker pull "$image"
          test "$(printf 'Abcdefg1\n' | docker run --rm -i "$image")" = 'OK'
          echo "Published and verified: $image"
